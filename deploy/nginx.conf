# nginx in front of PixelHop. Set PIXELHOP_TRUSTED_PROXIES=127.0.0.1 (and
# "cloudflare" too if Cloudflare sits in front of nginx).
server {
    listen 443 ssl http2;
    server_name p.example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    client_max_body_size 420M;   # PIXELHOP_MAX_UPLOAD_MB × PIXELHOP_MAX_BATCH
    proxy_read_timeout 300s;

    # POST /hop/media is the one route a server (FileHop) calls with a signed body before anything is checked. nginx
    # reads the whole body first (buffering on), so a slow sender never reaches PixelHop, and refuses the wrong
    # size and a stalled sender itself. Keep client_max_body_size at PIXELHOP_MAX_UPLOAD_MB (+1 MB).
    location = /hop/media {
        client_max_body_size 21M;
        client_body_timeout 20s;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream big uploads straight through
    }
}
