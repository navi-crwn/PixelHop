# nginx in front of PixelHop. Set PIXELHOP_TRUSTED_PROXIES=127.0.0.1 (and
# "cloudflare" too if Cloudflare sits in front of nginx).
server {
    listen 443 ssl http2;
    server_name p.example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    client_max_body_size 420M;   # PIXELHOP_MAX_UPLOAD_MB × PIXELHOP_MAX_BATCH
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream big uploads straight through
    }
}
