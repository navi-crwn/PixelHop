{{define "content"}}
<div class="wrap narrow center" style="padding-top:40px">
  <div class="feature" style="--c:var(--green);display:inline-block;padding:14px;border-radius:50%"><div class="ico" style="margin:0"><svg><use href="#i-check"/></svg></div></div>
  <h1 style="font-size:1.8rem;margin-top:14px">{{$.L.T "deleted.title"}}</h1>
  <p class="muted">{{$.L.T "deleted.text"}}</p>
  <a class="btn primary" href="{{if $.User}}/dashboard{{else}}/{{end}}">{{$.L.T "deleted.again"}}</a>
</div>
<span id="deleted-ok" hidden></span>
{{end}}
