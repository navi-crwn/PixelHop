{{define "content"}}
<div class="wrap">
  <div class="prose" style="margin:0 auto">
    <h1>{{.L.T "contact.title"}}</h1>
    <p class="lead">{{.L.T "contact.lead" "site" .Site}}</p>
    <ul class="contact-list">
      <li>{{.L.H "contact.bug"}}</li>
      <li>{{.L.H "contact.pr"}}</li>
      <li>{{.L.H "contact.security"}}</li>
      <li>{{.L.H "contact.rules"}}</li>
      {{with .Data}}<li><!--email_off-->{{$.L.H "contact.else" "email" .}}<!--/email_off--></li>{{end}}
    </ul>
  </div>
</div>
{{end}}
