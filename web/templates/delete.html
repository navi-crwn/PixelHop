{{define "content"}}{{$im := .Data}}
<div class="wrap narrow">
  <div class="card center" style="max-width:480px;margin:20px auto">
    <img src="{{thumb $im}}" alt="" style="max-height:220px;margin:0 auto 16px;border-radius:12px">
    <h1 style="font-size:1.5rem">{{$.L.T "delete.title"}}</h1>
    <p class="muted">{{$.L.H "delete.text" "id" $im.ID}}</p>
    <form method="post" class="btn-row" style="justify-content:center">
      <a class="btn" href="/{{$im.ID}}">{{$.L.T "delete.keep"}}</a>
      <button class="btn danger solid" type="submit"><svg><use href="#i-trash"/></svg>{{$.L.T "delete.forever"}}</button>
    </form>
  </div>
</div>
{{end}}
