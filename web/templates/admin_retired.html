{{define "content"}}
<div class="wrap narrow center" style="padding-top:40px">
  <img src="/static/img/logo.svg" alt="" width="96" height="96" style="margin:0 auto 18px;image-rendering:pixelated;opacity:.9">
  <h1 style="font-size:1.8rem">{{$.L.T "admin.moved"}}</h1>
  <p class="muted">{{$.L.T "admin.moved_text"}}</p>
  <p class="muted">{{$.L.H "admin.moved_how"}}</p>
  <div class="btn-row" style="justify-content:center;margin-top:20px"><a class="btn primary" href="/dashboard">{{$.L.T "admin.to_dashboard"}}</a></div>
</div>
{{end}}
