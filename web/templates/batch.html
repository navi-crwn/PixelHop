{{define "content"}}
<div class="wrap" style="max-width:1100px">
  <div class="page-head">
    <div><h1>{{$.L.T "batch.title"}}</h1><p class="muted" style="margin:4px 0 0">{{$.L.T "batch.sub"}}</p></div>
    <a class="btn ghost" href="/tools"><svg><use href="#i-adjust"/></svg>{{$.L.T "batch.back"}}</a>
  </div>

  <div class="batch" id="batch" data-signed-in="{{if .User}}1{{end}}" data-server="{{if .RembgServer}}1{{end}}" data-max-batch="{{.MaxBatch}}">
    <div>
      <div class="drop-in batch-drop" id="b-drop" role="button" tabindex="0">
        <div class="drop-icon" aria-hidden="true">{{range seq 16}}<i></i>{{end}}</div>
        <h2 style="font-size:1.15rem">{{$.L.T "batch.drop"}}</h2>
        <p class="muted small">{{$.L.T "form.or"}} <button class="btn sm" type="button" id="b-pick">{{$.L.T "batch.choose"}}</button> · {{$.L.T "batch.stay"}}</p>
        <input type="file" id="b-file" accept="image/*,.svg" multiple hidden>
      </div>
      <div class="batch-list" id="b-list"></div>
    </div>

    <aside class="panel">
      <h2>{{$.L.T "batch.steps"}}</h2>
      <p class="desc">{{$.L.T "batch.steps_desc"}}</p>
      <div class="field"><label for="b-size">{{$.L.T "batch.resize"}}</label>
        <select id="b-size"><option value="0">{{$.L.T "batch.keep_size"}}</option><option value="3840">3840 px (4K)</option><option value="2048">2048 px</option><option value="1920">1920 px</option><option value="1600">1600 px</option><option value="1080">1080 px</option><option value="800">800 px</option><option value="512">512 px</option></select></div>
      <div class="field"><label for="b-format">{{$.L.T "batch.format"}}</label>
        <select id="b-format"><option value="">{{$.L.T "batch.same"}}</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option><option value="image/avif">AVIF</option></select></div>
      <div class="field"><label>{{$.L.T "batch.quality"}}</label><div class="range-row"><input type="range" id="b-quality" min="10" max="100" value="82"><output id="b-qout">82</output></div></div>
      <div class="field"><label for="b-wm">{{$.L.T "batch.watermark"}} <span class="hint">{{$.L.T "batch.optional"}}</span></label>
        <div class="copy"><input type="text" id="b-wm" maxlength="80" placeholder="{{$.L.T "batch.wm_ph"}}"><select id="b-wm-pos" aria-label="{{$.L.T "batch.wm_pos"}}" style="max-width:120px"><option value="br">{{$.L.T "batch.pos_br"}}</option><option value="bl">{{$.L.T "batch.pos_bl"}}</option><option value="tr">{{$.L.T "batch.pos_tr"}}</option><option value="tl">{{$.L.T "batch.pos_tl"}}</option><option value="cc">{{$.L.T "batch.pos_cc"}}</option><option value="tile">{{$.L.T "batch.pos_tile"}}</option></select></div></div>
      <div class="batch-ai">
        <label class="check"><input type="checkbox" id="b-rembg"> <span>{{$.L.T "home.tool_rembg"}} <span class="pill acc">AI</span></span></label>
        <label class="check"><input type="checkbox" id="b-faces"> <span>{{$.L.T "tools.faces"}} <span class="pill acc">AI</span></span></label>
        <label class="check"><input type="checkbox" id="b-upscale"> <span>{{$.L.T "batch.upscale"}} <span class="pill acc">AI</span><br><span class="small muted">{{$.L.T "batch.upscale_note"}}</span></span></label>
        <p class="small muted" id="b-ai-note"></p>
      </div>
      <hr style="margin:16px 0">
      <div class="btn-row">
        <button class="btn primary" type="button" id="b-zip" disabled><svg><use href="#i-down"/></svg>{{$.L.T "batch.zip"}}</button>
        <button class="btn" type="button" id="b-upload" disabled><svg><use href="#i-upload"/></svg>{{$.L.T "batch.album"}}</button>
      </div>
      <div class="out-info" id="b-status" style="display:none"></div>
      <div id="b-result" class="hide" style="margin-top:10px"><div class="copy"><input type="text" readonly id="b-link" aria-label="{{$.L.T "batch.album_link"}}"><button class="btn sm" type="button" data-copy="#b-link"><svg><use href="#i-copy"/></svg></button></div></div>
    </aside>
  </div>
</div>
{{end}}
{{define "scripts"}}<script src="/static/js/svg.js?v={{.Asset}}" defer></script><script src="/static/js/batch.js?v={{.Asset}}" defer></script>{{end}}
