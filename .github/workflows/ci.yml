name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Changelog is plain and current
        run: python3 scripts/build-changelog.py --repo PixelHop --check && python3 -m unittest scripts/test_build_changelog.py
      - run: go vet ./...
      - run: go test -race ./...
      - run: make build && ./pixelhop version
