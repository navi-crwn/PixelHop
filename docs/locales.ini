[en]
dir = ltr
native = English
page_title = PixelHop — Fast, private image hosting and photo studio
page_desc = Upload images, strip GPS and camera metadata, edit in a private browser photo studio, and share links at p.hel.ink. Part of the HOP family.
og_title = PixelHop — Fast, private image hosting and photo studio
skip = Skip to content
nav_label = Page navigation
nav_features = Features
nav_run = Run your own
nav_faq = FAQ
nav_family = HOP family
theme_btn_dark = Dark theme
theme_btn_light = Light theme
kicker = Image hosting & photo studio
h1 = Drop an image, strip metadata, share in seconds
lede = PixelHop delivers fast image uploads, album galleries, and a private browser-based photo studio. Clean short links live at p.hel.ink and your dashboard at pixel.hel.ink. Single Go binary, self-hostable, open source (MIT).
cta_main = Try PixelHop
cta_explore = Explore images
cta_code = View the code
hero_note = Live addresses in this page link to the HOP family’s public sites.
features_h = What PixelHop does
f1_t = Fast uploads & clean links
f1_d = Drop photos, screenshots, or artwork to get readable short links at p.hel.ink/{slug}, direct image links, Markdown, and embed codes.
f2_t = Metadata stripped by default
f2_d = GPS coordinates, device serials, and EXIF tags are stripped by rewriting the container so original pixels are never re-compressed.
f3_t = Private browser photo studio
f3_d = Compress, resize, crop, convert to WebP/AVIF, blur sensitive details, and run OCR directly in your browser without uploading first.
f4_t = One sign-in for every app: HOP ID
f4_d = Sign in seamlessly with your HOP ID single sign-on account across the entire HOP family, or use PixelHop as a guest.
f5_t = Albums & bulk sharing
f5_d = Upload multiple images at once into a responsive gallery, copy all links in one click, or download a consolidated ZIP archive.
f6_t = Expiring & private links
f6_d = Set self-destruct timers (10 minutes, 24 hours, 30 days) or password-protect sensitive shares. Guests receive private deletion tokens.
f7_t = ShareX & REST API
f7_d = First-class ShareX destination configs, CLI uploading via pixelhop push, and personal API tokens for headless workflows.
f8_t = Single Go binary self-hosting
f8_d = Runs as a lightweight ~16 MB Go executable with embedded SQLite and supports local disk or any S3-compatible object storage.
run_h = Run your own
run_intro = PixelHop is self-hostable. Build and run the single binary in seconds:
run_req_h = Prerequisites
run_req = Go 1.22+ and SQLite. Full quickstart, Docker commands, and test suites are in the README on GitHub.
run_sso_h = Sign-in configuration
run_sso = Sign-in uses HOP ID single sign-on. Set HOP_HUB_URL, HOP_APP=pixelhop, and HOP_SSO_SECRET in your environment before signing in, or run in standalone mode.
run_db_h = Database & Storage
run_db = PixelHop defaults to an embedded SQLite database with local disk storage. Set S3 environment variables for cloud bucket storage.
run_note = Standalone and single sign-on modes are fully supported in self-hosted deployments.
faq_h = FAQ
q1 = Does PixelHop recompress or alter my image quality?
a1 = No. Metadata stripping removes EXIF and GPS headers by rewriting file containers without re-encoding pixels, preserving original visual fidelity.
q2 = Do I need an account to upload images?
a2 = No. Guest uploads are fully supported with private deletion tokens. Signing in with HOP ID unlocks personal galleries and persistent API keys.
q3 = Can I host PixelHop on my own server?
a3 = Yes. PixelHop compiles into a single standalone Go binary with zero external runtime dependencies. See the repository README for setup instructions.
q4 = Where do I report bugs or security issues?
a4 = Open an issue on GitHub or email security@hel.ink for responsible vulnerability disclosure.
family_h = The HOP family
family_intro = PixelHop is part of HOP, a lightweight suite of focused, self-hostable tools sharing a unified sign-in.
