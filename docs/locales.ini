lede = PixelHop 提供极速图片上传、相册合集以及完全在浏览器内运行的私密图片工坊。在 p.hel.ink 获得简洁短链，在 pixel.hel.ink 管理后台。单一 Go 二进制文件，支持私有化部署，开源 (MIT)。
