h1 = Solte uma imagem, limpe metadados, compartilhe em segundos
lede = O PixelHop oferece uploads rápidos de imagens, galerias de álbuns e um estúdio fotográfico privado diretamente no seu navegador. Links curtos limpos em p.hel.ink e seu painel em pixel.hel.ink. Binário Go único, auto-hospedável, código aberto (MIT).
cta_main = Experimentar PixelHop
cta_explore = Explorar imagens
cta_code = Ver o código
hero_note = Os endereços ativos nesta página apontam para os sites públicos da família HOP.
features_h = O que o PixelHop faz
f1_t = Uploads rápidos e links limpos
f1_d = Arraste fotos, capturas de tela ou ilustrações para gerar links curtos em p.hel.ink/{slug}, links diretos, Markdown e códigos de incorporação.
f2_t = Metadados removidos por padrão
f2_d = Coordenadas GPS, números de série e dados EXIF são removidos na reescrita do contêiner, sem recomprimir os pixels originais.
f3_t = Estúdio fotográfico privado no navegador
f3_d = Comprima, redimensione, corte, converta para WebP/AVIF, desfoque detalhes sensíveis e execute OCR no navegador sem fazer upload prévio.
f4_t = Um único login: HOP ID
f4_d = Faça login com sua conta de SSO HOP ID em toda a família HOP, ou utilize o PixelHop como visitante.
f5_t = Álbuns e compartilhamento em lote
f5_d = Envie múltiplas imagens em uma galeria responsiva, copie todos os links com um clique ou baixe um arquivo ZIP consolidado.
f6_t = Links com expiração e privados
