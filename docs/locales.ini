f7_t = ShareX e API REST
f7_d = Configurações prontas para ShareX, envio por linha de comando com pixelhop push e tokens de API pessoais.
f8_t = Binário único em Go para auto-hospedagem
f8_d = Executável Go leve de ~16 MB com SQLite integrado, compatível com disco local ou armazenamento S3.
